version: "2"

# Keeps the default linters (errcheck, govet, ineffassign, staticcheck, unused)
# and adds misspell for typos in comments/strings.
linters:
  enable:
    - misspell
  settings:
    errcheck:
      # Output to the terminal, and closing a file, has nothing to do on
      # failure; a write whose loss matters checks its error.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*os.File).Close
        - os.Setenv
