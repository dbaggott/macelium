name: release

# A merge to main that changes VERSION IS a release: this workflow tags the
# commit v<VERSION>, GoReleaser builds the macOS binaries and publishes a
# GitHub Release with them and install.sh attached (.goreleaser.yaml), and
# the workflow writes the Homebrew tap's formula, which installs the
# binaries. Pushes that don't change VERSION (or re-runs after a release)
# find the release already present and skip the tag and the release. Tagging,
# releasing, and the tap update live in one workflow because tags created
# with the workflow's GITHUB_TOKEN do not trigger other workflows. The verify
# job then installs what the tap now holds and checks the service's plist
# (.github/verify-formula.sh).
#
# workflow_dispatch (main only) re-runs the formula's steps against the
# existing release, recovering a release-created-but-tap-push-failed run;
# it is idempotent when the tap is already current.
#
# TAP_GITHUB_TOKEN must be a PAT with write access to dbaggott/homebrew-tap
# (GITHUB_TOKEN cannot push to another repo).

on:
  push:
    branches: [main]
    paths: ['VERSION']
  workflow_dispatch:

permissions:
  contents: write

# Serialize runs: two quick merges must not both see "no tag" and race to
# create the same release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Dispatch can target any branch; only ever release from main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      # Whether the tap was written, which is what verify checks.
      tap-written: ${{ steps.meta.outputs.write_tap }}
    steps:
      - name: Checkout macelium
        uses: actions/checkout@v7
        with:
          # GoReleaser's changelog reads the history.
          fetch-depth: 0

      - name: Read the version, and whether its tag and release exist
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(cat VERSION)"
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION holds '$version', not a version"
            exit 1
          fi
          tag="v$version"
          # --exit-code exits 2 when no ref matches; anything else but 0 is
          # a failed read, not an absent tag.
          tagged=true found=0
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null || found=$?
          case $found in
            0) ;;
            2) tagged=false ;;
            *)
              echo "::error::git ls-remote exited $found reading tag $tag"
              exit 1
              ;;
          esac
          # The release decides, not the tag: a run that tagged and then
          # failed to release releases on its re-run.
          if out=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" 2>&1); then
            echo "Release $tag already exists; nothing to release."
            new=false
          elif [[ $out == *"release not found"* ]]; then
            new=true
          else
            echo "::error::gh release view $tag failed: $out"
            exit 1
          fi
          write_tap=$new
          [[ $GITHUB_EVENT_NAME != workflow_dispatch ]] || write_tap=true
          {
            echo "new=$new"
            echo "tagged=$tagged"
            echo "write_tap=$write_tap"
            echo "tag=$tag"
            echo "version=$version"
          } >>"$GITHUB_OUTPUT"

      - name: Tag the release
        if: steps.meta.outputs.new == 'true' && steps.meta.outputs.tagged == 'false'
        run: |
          git tag "${{ steps.meta.outputs.tag }}" "$GITHUB_SHA"
          git push origin "${{ steps.meta.outputs.tag }}"

      # A tag from an earlier run is checked out, so GoReleaser builds the
      # commit it names.
      - name: Check out the tag
        if: steps.meta.outputs.new == 'true' && steps.meta.outputs.tagged == 'true'
        run: git checkout --quiet "${{ steps.meta.outputs.tag }}"

      - uses: actions/setup-go@v5
        if: steps.meta.outputs.new == 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and publish the release
        if: steps.meta.outputs.new == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Read the binaries' SHA256s
        if: steps.meta.outputs.write_tap == 'true'
        id: sha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.meta.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
            --pattern checksums.txt --output checksums.txt --clobber
          for arch in arm64 amd64; do
            sha="$(awk -v name="macelium_darwin_$arch.tar.gz" '$2 == name { print $1 }' checksums.txt)"
            if [[ -z $sha ]]; then
              echo "::error::checksums.txt has no macelium_darwin_$arch.tar.gz"
              exit 1
            fi
            echo "$arch=$sha" >>"$GITHUB_OUTPUT"
          done

      - name: Checkout homebrew-tap
        if: steps.meta.outputs.write_tap == 'true'
        uses: actions/checkout@v7
        with:
          repository: dbaggott/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Update formula
        if: steps.meta.outputs.write_tap == 'true'
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          TAG: ${{ steps.meta.outputs.tag }}
          SHA_ARM: ${{ steps.sha.outputs.arm64 }}
          SHA_INTEL: ${{ steps.sha.outputs.amd64 }}
        run: |
          mkdir -p tap/Formula
          download="https://github.com/${GITHUB_REPOSITORY}/releases/download/$TAG"
          # The formula installs the release's binary for the Mac's
          # architecture, and the completions macelium generates. The service
          # is the drift check: StartCalendarInterval of 09:00, run on wake
          # when the Mac slept through it, and not on load, which Homebrew's
          # service otherwise defaults to. std_service_path_env puts
          # Homebrew's bin on PATH without naming a prefix.
          cat >tap/Formula/macelium.rb <<RUBY
          class Macelium < Formula
            desc "Set up a Mac from a state repo and keep it there"
            homepage "https://github.com/dbaggott/macelium"
            version "$VERSION"
            license "MIT"

            depends_on :macos
            depends_on "chezmoi"
            depends_on "gh"
            depends_on "gitleaks"
            depends_on "mise"

            on_arm do
              url "$download/macelium_darwin_arm64.tar.gz"
              sha256 "$SHA_ARM"
            end
            on_intel do
              url "$download/macelium_darwin_amd64.tar.gz"
              sha256 "$SHA_INTEL"
            end

            def install
              bin.install "macelium"
              generate_completions_from_executable(bin/"macelium", "completion")
            end

            service do
              run [opt_bin/"macelium", "plan", "--notify"]
              run_type :cron
              cron "0 9 * * *"
              run_at_load false
              environment_variables PATH: std_service_path_env
              log_path "#{Dir.home}/Library/Logs/macelium-drift.log"
              error_log_path "#{Dir.home}/Library/Logs/macelium-drift.log"
            end

            test do
              assert_match "macelium $VERSION", shell_output("#{bin}/macelium --version")
            end
          end
          RUBY

      - name: Commit and push formula
        if: steps.meta.outputs.write_tap == 'true'
        working-directory: tap
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/macelium.rb
          if git diff --staged --quiet; then
            echo "No formula changes; skipping commit."
            exit 0
          fi
          git commit -m "macelium ${{ steps.meta.outputs.tag }}"
          git push

  verify:
    needs: release
    if: needs.release.outputs.tap-written == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Checkout macelium
        uses: actions/checkout@v7

      - name: Install the formula from the tap, test it and check its service
        run: .github/verify-formula.sh dbaggott/tap/macelium
