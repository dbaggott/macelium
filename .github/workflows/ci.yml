# The ci-required check the account's branch protection requires. The job id
# is the check name, so the job takes no `name:`, and the workflow takes no
# `paths` filter so the check reports on every pull request.
#
# The checks but the example's bootstrap and the installer's runs are in
# .github/check.sh, which runs locally too.

name: CI

on:
  pull_request:
    # `ready_for_review` runs CI when a draft is marked ready; the job skips while it is one.
    types: [opened, synchronize, reopened, ready_for_review]
  # A run on main records the installer against the release the tap holds.
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Each push to main is its own group, so none is cancelled while pending.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci-required:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: macos-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks reads the pull request's commits from history.
          fetch-depth: 0

      # chezmoi and mise are what macelium needs from Homebrew besides jq,
      # which the runner has.
      - name: Install chezmoi, mise, gitleaks and shellcheck
        run: brew install chezmoi mise gitleaks shellcheck

      - name: Run the checks
        timeout-minutes: 15
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: .github/check.sh "$BASE_SHA..$HEAD_SHA"

      # bootstrap needs a terminal, so it runs under script's. The example
      # becomes a clone of a local bare repo, so its checkout has an upstream.
      - name: Bootstrap the example, then plan it
        timeout-minutes: 15
        run: |
          set -euo pipefail
          state="$RUNNER_TEMP/state"
          git init -q --bare "$state.git"
          cp -R example "$state"
          git -C "$state" init -q -b main
          git -C "$state" add -A
          git -C "$state" -c user.name=ci -c user.email=ci@example.com commit -q -m example
          git -C "$state" remote add origin "$state.git"
          git -C "$state" push -q -u origin main

          script -q /dev/null "$GITHUB_WORKSPACE/macelium" bootstrap "$state" </dev/null

          # Again, now that the first run has written a real chezmoi config,
          # which names this checkout through its .chezmoiroot directory: the
          # refusal of a chezmoi setup that is not macelium's must pass it.
          again="$RUNNER_TEMP/bootstrap-again.log"
          script -q /dev/null "$GITHUB_WORKSPACE/macelium" bootstrap "$state" </dev/null | tee "$again"
          if grep -qF "chezmoi setup that is not macelium's" "$again"; then
            echo "the second bootstrap refused the chezmoi config the first wrote"
            exit 1
          fi

          # The greeting is a template reading home/.chezmoidata.toml.
          [[ $(cat ~/.config/macelium-example/greeting) == "hello from the macelium example" ]]

          # plan exits 2 here: the runner has Homebrew packages the example
          # does not list. Only 1, a failed check, fails the job.
          status=0
          script -q /dev/null "$GITHUB_WORKSPACE/macelium" plan </dev/null || status=$?
          echo "plan exited $status"
          [[ $status != 1 ]]

      # install.sh as a new Mac runs it, after the step above has bootstrapped
      # a clean runner with this branch's macelium. The Brewfile installed the
      # published macelium there, so it is removed first, for the installer to
      # install. The example's GitHub URL resolves to a local copy, which the
      # installer clones, and git reads it without a sign-in. The runner has
      # Homebrew. A second run must skip every step but the bootstrap.
      #
      # expect answers install.sh's prompts by their text: under script, only
      # the first read of the terminal gets end-of-file. It declines the
      # GitHub sign-in, which would open a browser. A prompt it doesn't know
      # fails the run after five minutes with no output. Its last pattern
      # takes each line's text up to a carriage return or newline, so any
      # output restarts the timeout, the status line's spinner frames
      # included, while a prompt, which ends with no line break, waits for
      # its own pattern. It leaves the line break in the buffer, where the
      # patterns that start with \n need it.
      - name: Install from the example with install.sh, then again
        timeout-minutes: 15
        env:
          # On a terminal, brew install asks before installing; expect's
          # terminal here has no one to answer.
          HOMEBREW_NO_ASK: 1
        run: |
          set -euo pipefail
          brew services stop macelium
          brew uninstall macelium

          src="$RUNNER_TEMP/example-src" remote="$RUNNER_TEMP/example.git"
          git init -q --bare "$remote"
          cp -R example "$src"
          git -C "$src" init -q -b main
          git -C "$src" add -A
          git -C "$src" -c user.name=ci -c user.email=ci@example.com commit -q -m example
          git -C "$src" push -q "$remote" main
          git -C "$remote" symbolic-ref HEAD refs/heads/main
          git config --global url."file://$remote".insteadOf https://github.com/macelium-ci/example
          # The first of the directories install.sh puts a clone in.
          mkdir -p ~/Developer

          run_install() {
            /usr/bin/expect -c '
              set timeout 300
              spawn bash install.sh macelium-ci/example
              expect {
                "so you can push changes from this machine?" { send "n\r"; exp_continue }
                -re {[^\r\n]+(?=[\r\n])} { exp_continue }
                timeout { puts "\nexpect: no output for 300s, so a prompt it does not know is waiting"; exit 1 }
                eof
              }
              exit [lindex [wait] 3]
            '
          }

          run_install

          again="$RUNNER_TEMP/install-again.log"
          run_install | tee "$again"
          for skipped in "Homebrew: already installed" "macelium: already installed" \
            "GitHub sign-in: not needed, git can read" "Clone: $HOME/Developer/example is already a clone" \
            "GitHub sign-in: skipped"; do
            grep -qF "==> $skipped" "$again" || {
              echo "the second run did not skip: $skipped"
              exit 1
            }
          done

      # install.sh with no argument, A1 and A2 of
      # https://github.com/dbaggott/macelium/issues/21, after the step above,
      # whose chezmoi config names a macelium checkout, as each of these
      # leaves it. Each state repo is a local bare repo that git reaches at a
      # URL on a host other than GitHub. expect answers each prompt by its
      # text, as above, and `macelium init`'s too, capturing what the runner
      # has.
      - name: Install with no argument, an existing repo on another host (A2) and a new one (A1)
        timeout-minutes: 30
        env:
          HOMEBREW_NO_ASK: 1
          # A1's Brewfile is the runner's own, so its bootstrap would upgrade
          # each of the runner's outdated packages, browsers included, which
          # tests nothing of macelium's.
          HOMEBREW_BUNDLE_NO_UPGRADE: 1
        run: |
          set -euo pipefail

          # Takes the state repo's URL. Runs install.sh with no argument,
          # answering another host, the URL, the default path, and init's
          # questions, and exits with its status.
          run_guided() {
            STATE_URL=$1 /usr/bin/expect -c '
              set timeout 300
              spawn bash install.sh
              expect {
                -ex {Choose 1 or 2 [1]: } { send "2\r"; exp_continue }
                -ex {git URL: } { send "$env(STATE_URL)\r"; exp_continue }
                -ex {Path for the state repo [} { send "\r"; exp_continue }
                -re {\nName( \[[^]]*\])?: } { send "macelium CI\r"; exp_continue }
                -re {\nEmail( \[[^]]*\])?: } { send "ci@example.com\r"; exp_continue }
                -re {Capture ~/[^\r\n]*\? \[Y/n\] } { send "y\r"; exp_continue }
                -ex {out of the state repo? [Y/n] } { send "y\r"; exp_continue }
                -re {[^\r\n]+(?=[\r\n])} { exp_continue }
                timeout { puts "\nexpect: no output for 300s, so a prompt it does not know is waiting"; exit 1 }
                eof
              }
              exit [lindex [wait] 3]
            '
          }

          # Takes a log and the lines it must hold, each after its ==>.
          assert_lines() {
            local log=$1 line
            shift
            for line in "$@"; do
              grep -qF "==> $line" "$log" || {
                echo "$log lacks: ==> $line"
                exit 1
              }
            done
          }

          # A2: a copy of the example, cloned and bootstrapped. The second
          # run finds the clone, and the refusal of a chezmoi setup that is
          # not macelium's passes the config the first wrote.
          src="$RUNNER_TEMP/a2-src" remote="$RUNNER_TEMP/a2.git"
          url=https://git.example.com/ci/example-state.git
          git init -q --bare -b main "$remote"
          cp -R example "$src"
          git -C "$src" init -q -b main
          git -C "$src" add -A
          git -C "$src" -c user.name=ci -c user.email=ci@example.com commit -q -m example
          git -C "$src" push -q "$remote" main
          git config --global url."file://$remote".insteadOf "$url"

          run_guided "$url"
          a2="$RUNNER_TEMP/a2-again.log"
          run_guided "$url" | tee "$a2"
          assert_lines "$a2" "Clone: $HOME/Developer/example-state is already a clone of $url" \
            "macelium bootstrap $HOME/Developer/example-state"
          if grep -qF "chezmoi setup that is not macelium's" "$a2"; then
            echo "A2: the second run refused the chezmoi config the first wrote"
            exit 1
          fi

          # A1: an empty repo, so install.sh takes the create flow: init
          # captures the runner, the push, then the bootstrap. Afterwards
          # plan finds nothing to list in the Homebrew or files sections.
          # Upgrades available are left out: they follow Homebrew's
          # releases, not what init captured.
          remote="$RUNNER_TEMP/a1.git" url=https://git.example.com/ci/state.git
          git init -q --bare -b main "$remote"
          git config --global url."file://$remote".insteadOf "$url"

          a1="$RUNNER_TEMP/a1.log"
          run_guided "$url" | tee "$a1"
          assert_lines "$a1" "macelium init $HOME/Developer/state" "Pushing $HOME/Developer/state to $url" \
            "macelium bootstrap $HOME/Developer/state"
          [[ -n $(git -C "$remote" for-each-ref) ]] || {
            echo "A1: nothing was pushed"
            exit 1
          }

          plan="$RUNNER_TEMP/a1-plan.log"
          status=0
          script -q /dev/null macelium plan </dev/null | tr -d '\r' | tee "$plan" || status=$?
          echo "plan exited $status"
          [[ $status != 1 ]]
          for heading in "Files" "Homebrew: listed but not installed" "Homebrew: installed but not listed — keep or remove each"; do
            if grep -qxF "$heading" "$plan"; then
              echo "A1: plan lists differences under $heading"
              exit 1
            fi
          done

          # A second run finds the repo pushed and the path its clone, so it
          # reaches the bootstrap with no init and no push.
          a1="$RUNNER_TEMP/a1-again.log"
          run_guided "$url" | tee "$a1"
          assert_lines "$a1" "Clone: $HOME/Developer/state is already a clone of $url" "macelium bootstrap $HOME/Developer/state"
          for line in "macelium init" "Pushing"; do
            if grep -qF "==> $line" "$a1"; then
              echo "A1: the second run ran: $line"
              exit 1
            fi
          done

      # Each bootstrap step's output goes to its log, not the job's.
      - name: Print the bootstrap log
        if: failure()
        run: cat ~/Library/Logs/macelium-bootstrap.log
